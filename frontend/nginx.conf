server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno do Docker (necessario para resolver o servico da API)
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Proxy da API: /api/auth/login -> http://conecte-bem_api:8080/auth/login
  location /api/ {
    set $api_upstream http://conecte-bem_api:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Site e API passam a ser a MESMA origem (tudo sai de /api no mesmo dominio),
    # entao nao ha CORS a validar. Sem este header o Spring trata POST/PUT/DELETE
    # como requisicao cross-origin e responde 403 "Invalid CORS request", porque
    # o SecurityConfig so libera http://localhost:5173 e http://localhost:3000.
    proxy_set_header Origin "";
  }

  # SPA React: qualquer rota cai no index.html
  location / {
    try_files $uri /index.html;
  }
}
