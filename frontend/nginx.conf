server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno do Docker (necessario para resolver o servico da API)
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Proxy da API: /api/auth/login -> http://conecte-bem_api:8080/auth/login
  location /api/ {
    set $api_upstream http://conecte-bem_api:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA React: qualquer rota cai no index.html
  location / {
    try_files $uri /index.html;
  }
}
