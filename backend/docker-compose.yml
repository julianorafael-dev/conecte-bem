services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env antes de iniciar o Docker.}
      POSTGRES_DB: ${DB_NAME:-conect-bem-db}
    ports:
      - "5432:5432"
    volumes:
      - conecte_bem_data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@conectebem.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
volumes:
  conecte_bem_data:
