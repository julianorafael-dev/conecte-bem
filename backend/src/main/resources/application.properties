spring.config.import=optional:file:./backend/.env.local[.properties],optional:file:./.env.local[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/conect-bem-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

api.security.token.secret=${JWT_SECRET}

google.client.id=${GOOGLE_CLIENT_ID:420802544950-mjfq2tfidn37ehqp23suos1lbo8ikh2e.apps.googleusercontent.com}

# E-mail do formulário de Contato (Mailtrap Sandbox em desenvolvimento).
# MAIL_USERNAME e MAIL_PASSWORD nunca devem ser enviados ao Git.
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

contato.email.destino=${CONTATO_EMAIL_DESTINO:matheusmolinari01@gmail.com}

