spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Valor fictício exclusivo para a suíte de testes. Em execução normal, o
# backend exige JWT_SECRET configurado fora dos arquivos versionados.
api.security.token.secret=segredo-ficticio-exclusivo-para-testes-12345

# Valor fictício: permite criar o bean de validação Google sem depender de
# credencial externa durante os testes automatizados.
google.client.id=test-client-id.apps.googleusercontent.com

# Valores fictícios: permitem criar o JavaMailSender sem depender de
# credencial externa durante os testes automatizados. Nenhum e-mail real é
# enviado pela suíte de testes.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=teste
spring.mail.password=teste

contato.email.destino=destino-teste@conectebem.local
